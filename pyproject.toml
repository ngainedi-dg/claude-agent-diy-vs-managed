[project]
name = "claude-agent-diy-vs-managed"
version = "0.1.0"
description = "The same autonomous data-analyst agent built with the Claude Messages API and with Anthropic Managed Agents."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.92.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "jsonschema>=4.20",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
